# 本地构建配置 - 用于开发环境
# 使用方式: ./run_compose.sh local
#
# 此配置文件会从本地源代码构建所有镜像，适合开发调试使用
#
# 数据库配置:
# - 默认使用 PostgreSQL（生产环境推荐）
# - 如需使用 SQLite（本地开发），请设置环境变量 DATABASE_TYPE=sqlite 并注释掉 postgres 服务

services:
  # PostgreSQL 数据库服务（生产环境默认启用）
  postgres:
    image: ${DOCKER_POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: wharttest-postgres
    command: postgres -c max_connections=500
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-wharttest}
    ports:
      - "0.0.0.0:8919:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - wharttest-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 服务 - Celery的broker和backend
  redis:
    image: ${DOCKER_REDIS_IMAGE:-redis:7-alpine}
    container_name: wharttest-redis
    ports:
      - "0.0.0.0:8911:6379"
    volumes:
      - redis-data:/data
    networks:
      - wharttest-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # 后端 Django 服务（包含Celery Worker和Beat）
  backend:
    # 本地构建模式
    build:
      context: ./WHartTest_Django
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${DOCKER_PYTHON_BASE_IMAGE:-python:3.11-slim}
        APT_BASE_URL: ${DOCKER_APT_BASE_URL:-http://deb.debian.org}
        PIP_INDEX_URL: ${DOCKER_PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_INDEX_FALLBACKS: ${DOCKER_PIP_INDEX_FALLBACKS:-}
        HF_ENDPOINT: ${DOCKER_HF_ENDPOINT:-https://huggingface.co}
        NPM_REGISTRY: ${DOCKER_NPM_REGISTRY:-https://registry.npmjs.org}
        PLAYWRIGHT_DOWNLOAD_HOST: ${DOCKER_PLAYWRIGHT_DOWNLOAD_HOST:-}
    container_name: wharttest-backend
    # 启动逻辑已移至 Dockerfile 的 ENTRYPOINT 和 supervisord.conf
    ports:
      - "0.0.0.0:8912:8000"
    volumes:
      - ./data:/app/data
      - backend-static:/app/static
      - ./WHartTest_Skills:/app/bundled_skills:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 数据库配置
      # 默认使用 PostgreSQL（生产环境推荐）
      # 如需使用 SQLite（本地开发），请设置 DATABASE_TYPE=sqlite
      - DATABASE_TYPE=${DATABASE_TYPE:-postgres}
      # SQLite 配置（DATABASE_TYPE=sqlite 时使用）
      - DATABASE_PATH=${DATABASE_PATH:-/app/data/db.sqlite3}
      # PostgreSQL 配置（DATABASE_TYPE=postgres 时使用）
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-wharttest}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      # 其他配置
      - MEDIA_ROOT=${MEDIA_ROOT:-/app/data/media}
      - LANGGRAPH_CHECKPOINT_SQLITE_PATH=${LANGGRAPH_CHECKPOINT_SQLITE_PATH:-/app/data/chat_history.sqlite}
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-change-this-in-production}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-*}
      - DJANGO_CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80,http://*:8913
      - USER_AGENT=${USER_AGENT:-WHartTest/2.7.2-ce}
      - DJANGO_ADMIN_USERNAME=${DJANGO_ADMIN_USERNAME:-admin}
      - DJANGO_ADMIN_EMAIL=${DJANGO_ADMIN_EMAIL:-admin@example.com}
      # 安全：不再默认 admin123456。未设置时 init_admin 会生成随机初始密码并打印一次
      - DJANGO_ADMIN_PASSWORD=${DJANGO_ADMIN_PASSWORD:-}
      # Celery配置
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # 内部API基础URL - 使用localhost因为在同一容器
      - DJANGO_BASE_URL=http://localhost:8000
      - WEIXIN_PLUGIN_HOST_URL=http://weixin-plugin-host:3001
      - DOCX_EDITOR_BASE_URL=${DOCX_EDITOR_BASE_URL:-http://host.docker.internal:18080}
      - DOCX_EDITOR_PUBLIC_BASE_URL=${DOCX_EDITOR_PUBLIC_BASE_URL:-}
      - DOCX_EDITOR_SERVICE_KEY=${DOCX_EDITOR_SERVICE_KEY:-docx-editor-default-integration-key-2026}
      # Qdrant向量数据库
      - QDRANT_URL=http://qdrant:6333
      - HF_ENDPOINT=${DOCKER_HF_ENDPOINT:-https://huggingface.co}
      # Skill 执行模式：runner（默认，第 2 层独立沙箱）或 inprocess（第 1 层进程内加固，
      # 文件系统/业务网段不做隔离，仅建议本地开发）
      - SKILL_EXEC_MODE=${SKILL_EXEC_MODE:-runner}
      - SKILL_RUNNER_URL=${SKILL_RUNNER_URL:-http://skill-runner:8923}
      - SKILL_RUNNER_TOKEN=${SKILL_RUNNER_TOKEN:-}
      - SKILL_EXEC_TIMEOUT_SECONDS=${SKILL_EXEC_TIMEOUT_SECONDS:-120}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      weixin-plugin-host:
        condition: service_started
      # runner 是默认执行面：先等它健康再启动 backend，避免首批 skill 调用直接失败
      skill-runner:
        condition: service_healthy
    networks:
      - wharttest-network
      # 同时接入执行网，才能把作业提交给 skill-runner（反向不可达：runner 进不了业务网）
      - skill-runner-net
    restart: unless-stopped
    # Skill 命令由 LLM 生成，可能在 backend 容器内执行；这里收紧容器级权限，
    # 作为进程内加固（orchestrator_integration/builtin_tools/skill_exec_guard.py）之外的兜底：
    # - no-new-privileges：禁止 setuid/setcap 提权
    # - 丢弃与业务无关的高危 capability
    # - pids_limit：限制进程/线程总数，缓解 fork bomb（与 RLIMIT_NPROC 互补，root 下后者不生效）
    # 说明：mem_limit 需按客户实际负载评估后再启用，避免影响嵌入模型与浏览器流程。
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - MKNOD
      - AUDIT_WRITE
      - SETFCAP
      - SYS_CHROOT
    pids_limit: 8192
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/admin/login/')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  weixin-plugin-host:
    build:
      context: ./WHartTest_WeixinPluginHost
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: ${DOCKER_NODE_22_BASE_IMAGE:-node:22-alpine}
        NPM_REGISTRY: ${DOCKER_NPM_REGISTRY:-https://registry.npmjs.org}
    container_name: wharttest-weixin-plugin-host
    ports:
      - "0.0.0.0:8922:3001"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      # weixin-plugin-host 回调后端的地址
      # - Docker 全量部署（后端也在容器内）：http://backend:8000（使用 Docker 内部网络）
      # - 本地开发（后端在宿主机上）：http://host.docker.internal:8000
      #   注意：后端必须监听 0.0.0.0（不能是 127.0.0.1），否则容器无法访问
      #   启动命令示例：uvicorn wharttest_django.asgi:application --host 0.0.0.0 --port 8000
      - WHARTTEST_BACKEND_URL=${WHARTTEST_BACKEND_URL:-http://backend:8000}
      # 安全：不再回退到源码里公开过的固定演示密钥，请通过 .env 显式配置
      - WHARTTEST_API_KEY=${WHARTTEST_API_KEY:-}
      - WHARTTEST_SHARED_DATA_DIR=/app/data
      - OPENCLAW_STATE_DIR=/app/data/openclaw-state
      - OPENCLAW_CONFIG=/app/data/openclaw-state/openclaw.json
    networks:
      - wharttest-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # 前端 Vue 服务
  frontend:
    # 本地构建模式
    build:
      context: ./WHartTest_Vue
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: ${DOCKER_NODE_BASE_IMAGE:-node:20-alpine}
        NGINX_BASE_IMAGE: ${DOCKER_NGINX_BASE_IMAGE:-nginx:alpine}
        NPM_REGISTRY: ${DOCKER_NPM_REGISTRY:-https://registry.npmjs.org}
    container_name: wharttest-frontend
    ports:
      - "0.0.0.0:8913:80"
    depends_on:
      - backend
    networks:
      - wharttest-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # UI 自动化执行器（默认无头浏览器容器）
  actuator:
    build:
      context: ./WHartTest_Actuator
      dockerfile: Dockerfile
      args:
        PLAYWRIGHT_PYTHON_IMAGE: ${DOCKER_PLAYWRIGHT_PYTHON_IMAGE:-mcr.microsoft.com/playwright/python:v1.60.0-jammy}
        PIP_INDEX_URL: ${DOCKER_PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: wharttest-actuator
    shm_size: "1gb"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - WHARTTEST_ACTUATOR_DOCKER=1
      - WHARTTEST_ACTUATOR_WS_URL=${WHARTTEST_ACTUATOR_WS_URL:-ws://host.docker.internal:8000/ws/ui/actuator/}
      - WHARTTEST_ACTUATOR_API_URL=${WHARTTEST_ACTUATOR_API_URL:-http://host.docker.internal:8000}
      - WHARTTEST_ACTUATOR_USE_GUI=false
      - WHARTTEST_ACTUATOR_HEADLESS=false
      - WHARTTEST_ACTUATOR_PERSISTENT=false
      # API Key 认证（推荐）：配置后执行器不再调用 /api/token/ 登录，
      # 避免触发后端「单设备登录」导致浏览器会话被挤掉
      # 安全：不再回退到源码里公开过的固定演示密钥，请通过 .env 显式配置
      - WHARTTEST_ACTUATOR_API_KEY=${WHARTTEST_ACTUATOR_API_KEY:-}
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    networks:
      - wharttest-network
    restart: unless-stopped

  # Skill 命令的独立执行面（第 2 层安全加固，默认执行模式）
  #
  # 与 backend 的关系：backend 只做鉴权与取可见 skill 目录，把命令交给本服务执行；
  # backend 的 SKILL_EXEC_MODE 默认即为 runner，本服务随栈默认启动。
  # 本服务刻意做到「无秘密、无业务网段、无持久化」：
  #   - 不注入任何平台机密（DJANGO_SECRET_KEY / DB 口令 / LLM Key 都不在此容器环境里）
  #   - 只加入 skill-runner-net，到不了 postgres/redis/qdrant
  #   - 根文件系统只读，工作区用 tmpfs，作业结束即销毁
  # 必须在 .env 配置 SKILL_RUNNER_TOKEN，否则本服务拒绝所有作业（fail-closed），
  # backend 侧 skill 执行会直接报错而不会回退到进程内执行。
  # 如需回退第 1 层进程内执行：在 .env 设 SKILL_EXEC_MODE=inprocess。
  skill-runner:
    # 与 backend 复用同一个镜像名：runner 只是换了个入口命令，没必要再打一份
    # 4GB 的镜像。compose 见到相同 image 名会复用已构建的镜像层（构建缓存命中）。
    image: ${SKILL_RUNNER_IMAGE:-wharttest-backend}
    build:
      context: ./WHartTest_Django
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${DOCKER_PYTHON_BASE_IMAGE:-python:3.12-slim}
        APT_BASE_URL: ${DOCKER_APT_BASE_URL:-http://deb.debian.org}
        PIP_INDEX_URL: ${DOCKER_PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_INDEX_FALLBACKS: ${DOCKER_PIP_INDEX_FALLBACKS:-}
        NPM_REGISTRY: ${DOCKER_NPM_REGISTRY:-https://registry.npmjs.org}
        PLAYWRIGHT_DOWNLOAD_HOST: ${DOCKER_PLAYWRIGHT_DOWNLOAD_HOST:-}
    container_name: wharttest-skill-runner
    # 以数据目录属主身份运行：
    #   - 产物/截图写进宿主 media 后属主正确，backend（同为该 uid）能正常清理；
    #   - 不需要补回 DAC_OVERRIDE（cap_drop: ALL 后 root 反而写不了宿主属主目录）。
    # 用 `stat -c '%u:%g' data/media/skill_runtime` 可查得应填的 UID/GID。
    user: "${SKILL_RUNNER_UID:-1000}:${SKILL_RUNNER_GID:-1000}"
    # 必须覆盖 entrypoint：镜像的 /app/entrypoint.sh 末尾无条件 `exec supervisord`
    # 且忽略 CMD，若只用 command 会被忽略、runner 容器会启动成 Django+celery。
    # runner 不需要数据库准备步骤，直接启动服务即可。
    entrypoint: ["python", "-m", "skill_runner.server"]
    # HOME 指向可写 tmpfs，避免只读根文件系统下 node/playwright 写缓存失败
    environment:
      - HOME=/tmp
      - SKILL_RUNNER_HOST=0.0.0.0
      - SKILL_RUNNER_PORT=8923
      - SKILL_RUNNER_TOKEN=${SKILL_RUNNER_TOKEN:-}
      - SKILL_RUNNER_SKILLS_ROOT=/app/data/media
      - SKILL_RUNNER_WORKSPACE_ROOT=/tmp
      - SKILL_RUNNER_MAX_CONCURRENT_JOBS=${SKILL_RUNNER_MAX_CONCURRENT_JOBS:-4}
      - SKILL_EXEC_TIMEOUT_SECONDS=${SKILL_EXEC_TIMEOUT_SECONDS:-120}
      # 注意：本服务复用 WHartTest_Django 镜像，Chromium 由 Dockerfile 的
      # `playwright install chromium` 装到默认缓存目录；/ms-playwright 是
      # Actuator 镜像（mcr.microsoft.com/playwright/python）的路径，不能混用。
      - PLAYWRIGHT_BROWSERS_PATH=${SKILL_RUNNER_PLAYWRIGHT_BROWSERS_PATH:-/opt/ms-playwright}
      - LLM_BROWSER_AUTO_CHROME=1
    volumes:
      # skill 目录只读可见（与 backend 的 MEDIA_ROOT 同路径，便于路径直接互通）
      - ./data/media:/app/data/media:ro
      # 产物/截图目录可写，供 backend 的产物收集逻辑继续工作
      - ./data/media/skill_runtime:/app/data/media/skill_runtime
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 4096
    mem_limit: ${SKILL_RUNNER_MEM_LIMIT:-4g}
    cpus: ${SKILL_RUNNER_CPUS:-2}
    networks:
      # 只挂执行网：与 postgres/redis/qdrant 所在网段隔离
      - skill-runner-net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8923/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # MCP 服务（独立容器，默认不启动）
  #
  # 该服务以 root 绑定 0.0.0.0 暴露 WHartTest_tools(8006) 与 ms_mcp_api(8007)，
  # 默认关闭：仅在需要对接 MCP 客户端时显式启用：
  #     docker compose --profile mcp up -d mcp
  # 启用前必须在 .env 配置 MCP_SHARED_TOKEN（未配置会 fail-closed 拒绝启动），
  # 并在客户端请求头带上 Authorization: Bearer <同一密钥>。
  mcp:
    profiles:
      - mcp
    # 本地构建模式
    build:
      context: ./WHartTest_MCP
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${DOCKER_PYTHON_BASE_IMAGE:-python:3.11-slim}
        APT_BASE_URL: ${DOCKER_APT_BASE_URL:-http://deb.debian.org}
        PIP_INDEX_URL: ${DOCKER_PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_INDEX_FALLBACKS: ${DOCKER_PIP_INDEX_FALLBACKS:-}
    container_name: wharttest-mcp
    user: root
    environment:
      # WHartTest Tools 配置
      - WHARTTEST_BACKEND_URL=${WHARTTEST_BACKEND_URL:-http://backend:8000}
      # 安全：不再回退到源码里公开过的固定演示密钥，请通过 .env 显式配置
      - WHARTTEST_API_KEY=${WHARTTEST_API_KEY:-}
      # MS MCP API 配置（可选）
      - MS_API_HOST=${MS_API_HOST:-http://ms.example.com}
      - MS_ACCESS_KEY=${MS_ACCESS_KEY:-your_16byte_key1}
      - MS_SECRET_KEY=${MS_SECRET_KEY:-your_16byte_key2}
      # MCP 共享密钥：未配置时服务会拒绝启动（fail closed，防止无鉴权裸奔）；
      # 客户端请求头需带 Authorization: Bearer <同一密钥>。
      # 本机联调可临时设 MCP_ALLOW_UNAUTHENTICATED=true，严禁暴露到任何网络。
      - MCP_SHARED_TOKEN=${MCP_SHARED_TOKEN:-}
      - MCP_ALLOW_UNAUTHENTICATED=${MCP_ALLOW_UNAUTHENTICATED:-false}
    ports:
      - "0.0.0.0:8914:8006" # WHartTest_tools 服务端口
      - "0.0.0.0:8915:8007" # ms_mcp_api 服务端口
    volumes:
      - ./data/playwright-screenshots:/tmp/playwright-output # 使用本地目录挂载
      # 鉴权模块以只读方式挂入（不再写进镜像 COPY 清单）：
      # 未提供该文件时两个入口会 fail-closed 拒绝启动，不会退化成无鉴权裸奔。
      - ./WHartTest_MCP/mcp_auth.py:/app/mcp_auth.py:ro
    depends_on:
      - backend
    networks:
      - wharttest-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8006), 5).close(); socket.create_connection(('127.0.0.1', 8007), 5).close()" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Playwright MCP 服务（官方Docker镜像）
  # 官方 Playwright MCP（默认不启动，与 WHartTest MCP 同属 mcp profile）
  #
  # 该服务以 --allowed-hosts "*" 与 --no-sandbox 运行并对外暴露 8916 端口，
  # 默认关闭；需要对接 MCP 客户端时一并启用：
  #     docker compose --profile mcp up -d
  playwright-mcp:
    profiles:
      - mcp
    image: ${DOCKER_PLAYWRIGHT_MCP_IMAGE:-mcr.microsoft.com/playwright/mcp}
    container_name: wharttest-playwright-mcp
    user: root # 以 root 用户运行,确保有权限写入挂载目录
    entrypoint: [ "node", "/app/cli.js" ]
    command: [ "--no-sandbox", "--host", "0.0.0.0", "--allowed-hosts", "*", "--config", "/app/playwright-mcp-config.json" ]
    ports:
      - "0.0.0.0:8916:8931"
    volumes:
      - ./data/playwright-screenshots:/tmp/playwright-output # 使用本地目录挂载
      - ./WHartTest_MCP/playwright-mcp-config.json:/app/playwright-mcp-config.json:ro # 挂载配置文件
    networks:
      - wharttest-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:8931/mcp', res => process.exit(res.statusCode ? 0 : 1)).on('error', () => process.exit(1))" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Xinference 模型推理服务（Embedding + Reranker）
  # xinference:
  #   image: xprobe/xinference:latest-cpu
  #   container_name: wharttest-xinference
  #   ports:
  #     - "0.0.0.0:8917:9997"
  #   volumes:
  #     - xinference-data:/root/.xinference
  #     - xinference-cache:/root/.cache/huggingface
  #   environment:
  #     - HF_ENDPOINT=https://hf-mirror.com
  #   networks:
  #     - wharttest-network
  #   restart: unless-stopped
  #   command: xinference-local -H 0.0.0.0
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:9997/"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 60s
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 6G
    # 启动后需要部署模型:
    # Embedding: curl -X POST http://localhost:8917/v1/models -d '{"model_name": "bge-m3", "model_type": "embedding"}'
    # Reranker:  curl -X POST http://localhost:8917/v1/models -d '{"model_name": "bge-reranker-v2-m3", "model_type": "rerank"}'

  # Qdrant 向量数据库 - 知识库检索
  qdrant:
    image: ${DOCKER_QDRANT_IMAGE:-qdrant/qdrant:latest}
    container_name: wharttest-qdrant
    ports:
      - "0.0.0.0:8918:6333"  # REST API
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - wharttest-network
    restart: unless-stopped

networks:
  wharttest-network:
    driver: bridge
  # 独立执行网：skill-runner 与 backend 在此互通，但 postgres/redis/qdrant
  # 只挂在 wharttest-network 上，因此被 skill 执行的代码到不了数据面。
  skill-runner-net:
    driver: bridge

volumes:
  backend-static:
  redis-data:
  postgres-data:
  celery-beat-schedule:
  xinference-data:
  xinference-cache:
  qdrant-data:
    # db.sqlite3 和 media 改用本地目录挂载，不再需要 named volume
    # playwright-screenshots 改用本地目录挂载，不再需要 named volume


