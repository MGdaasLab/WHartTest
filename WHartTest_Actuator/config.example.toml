# UI自动化执行器配置文件
# 复制此文件为 config.toml 并修改配置

[server]
# WebSocket服务器地址
ws_url = "ws://127.0.0.1:8000/ws/ui/actuator/"
# API服务器地址
api_url = "http://127.0.0.1:8000"
# 是否启用 GUI 登录窗口（需要安装 CustomTkinter）
# true = 使用图形界面登录（推荐）
# false = 使用配置文件中的账号密码，适合服务器无头部署
use_gui = true
# API认证用户名（仅 use_gui=false 时有效）
api_username = "admin"
# API认证密码（仅 use_gui=false 时有效）
api_password = "admin123"

[actuator]
# 执行器名称（可选，默认自动生成）
# name = "my-actuator"
# 执行器描述（可选）
# description = "测试执行器"

[browser]
# 浏览器类型: chromium, firefox, webkit
browser_type = "chromium"
# 是否无头模式
headless = false
# 是否持久化浏览器上下文
persistent = true
# 持久化数据目录
user_data_dir = "./data/browser"
# 浏览器启动超时（秒）
launch_timeout = 30
# 操作超时（秒）
action_timeout = 30

# ---------------------------------------------------------------------------
# HTTPS 客户端证书
# 用于访问要求「客户端证书」的 HTTPS 站点（如银行/内网自签名双向 TLS 站点）。
# 证书文件只从本机路径读取，不会经过平台传输。
#
# 生效规则：
#   1. 证书必须与访问站点精确匹配 origin（https://host[:port]），Playwright 不支持通配；
#      origin 默认从用例的 base_url / 页面 URL 自动推导，无需手工填写。
#   2. 访问「同证书的多个域名」时，用 client_cert_origins 补充（逗号分隔）。
#   3. 不要把 .pfx 口令写在这里 —— 建议用环境变量注入（见下），避免明文落盘。
# ---------------------------------------------------------------------------
# 是否启用客户端证书
client_cert_enabled = false
# PKCS#12 证书文件（.pfx / .p12）；相对路径以本文件所在目录为基准
# client_cert_pfx_path = "./certs/client.pfx"
# PKCS#12 口令。强烈建议改用环境变量注入：
#   WHARTTEST_ACTUATOR_CLIENT_CERT_PASSPHRASE=你的口令
# client_cert_passphrase = ""
# 或改用 PEM 方案（.pem/.crt + .key），与上面的 pfx 二选一（同时配置时优先 pfx）
# client_cert_cert_path = "./certs/client.crt"
# client_cert_key_path = "./certs/client.key"
# 额外的生效 origin（逗号分隔），用于同证书覆盖多个域名
# client_cert_origins = "https://a.example.com,https://b.example.com:8443"
# 是否忽略 HTTPS 证书校验错误（服务端证书自签名时通常需要）
# 留空或写 "auto" = 自动：stealth 开启或已配置客户端证书时启用，否则沿用 Playwright 默认
# 也可显式写 true / false 强制覆盖
# ignore_https_errors = "auto"

[execution]
# 失败重试次数
retry_count = 3
# 步骤间隔时间（毫秒）
step_interval = 500
# 截图保存目录
screenshot_dir = "./data/screenshots"
# 批量执行最大并发数（同时运行的用例数）
max_concurrent = 3

[trace]
# 是否启用 Playwright Trace（用于调试回放）
enabled = true
# Trace 保存目录
trace_dir = "./data/traces"
# 是否记录截图
screenshots = true
# 是否记录 DOM 快照
snapshots = true
# 是否记录源代码
sources = false

[logging]
# 日志级别: DEBUG, INFO, WARNING, ERROR
level = "INFO"
# 日志文件（可选，不设置则只输出到控制台）
# file = "./data/logs/actuator.log"

[gui]
# GUI 语言: zh, en
language = "zh"

[model]
# AI 模型配置（用于 step_type=10「AI操作」步骤，AI Agent 自主驱动 Playwright）
# OpenAI 兼容端点（vllm / ollama / OpenAI / Azure 等均兼容）
api_url = "http://192.168.2.180:3000/v1"
api_key = "sk-Cra0HlWnPgKnL8VP03Df097eA3B24dBcB1904d32C3812783"
# 模型名称
model = "qwen3-coder"
# 提供者类型（当前仅支持 openai_compatible，预留扩展）
provider = "openai_compatible"
# 是否为视觉模型(VLM)：true 时通过截图理解页面；false 时用可访问性树/innerText 文本快照
supports_vision = false
# 模型上下文上限(估算 token)，超过阈值会触发历史压缩
context_limit = 100000
# AI 单步骤最大工具调用轮数（安全阈值，避免死循环）
max_steps = 25
# 采样温度，0 表示尽量确定性
temperature = 0.0
