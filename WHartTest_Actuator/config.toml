[server]
ws_url = "ws://127.0.0.1:8000/ws/ui/actuator/"
api_url = "http://172.31.69.83:5173"
use_gui = true
api_username = "admin"
api_password = "admin123456"

[actuator]
name = "本地执行器"

[browser]
browser_type = "chromium"
headless = true
persistent = false
user_data_dir = "./data/browser"
launch_timeout = 30
action_timeout = 5
viewport_width = 1280
viewport_height = 720

[execution]
retry_count = 0
step_interval = 100
screenshot_dir = "./data/screenshots"
max_concurrent = 1

[trace]
enabled = true
trace_dir = "./data/traces"
screenshots = true
snapshots = true
sources = false

[logging]
level = "INFO"

[gui]
language = "zh"
