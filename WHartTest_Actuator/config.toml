[server]
ws_url = "ws://127.0.0.1:8000/ws/ui/actuator/"
api_url = "http://127.0.0.1:8000"
use_gui = true
api_key = ""  # 安全：请配置后端下发的 API Key，不要提交真实密钥

[actuator]
name = "Actuator"

[browser]
browser_type = "chromium"
headless = false
persistent = false
user_data_dir = "./data/browser"
launch_timeout = 30
action_timeout = 5
viewport_width = 1280
viewport_height = 720

[execution]
retry_count = 0
step_interval = 100
screenshot_dir = "./data/screenshots"
max_concurrent = 2
fail_fast = false

[trace]
enabled = true
trace_dir = "./data/traces"
screenshots = true
snapshots = true
sources = false

[logging]
level = "INFO"

[gui]
language = "zh"
